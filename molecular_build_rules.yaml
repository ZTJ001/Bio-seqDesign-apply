  cricetulus_griseus:
    description: 中国仓鼠（CHO 细胞）偏好密码子，供哺乳动物细胞表达/稳定株构建密码子优化参考
    source: Cricetulus griseus 偏好密码子表（图片整理，2026-11-20）
