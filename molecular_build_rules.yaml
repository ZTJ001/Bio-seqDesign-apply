metadata:
  version: 2.1-public
  description: 分子构建SOP校验规则库（推理精简版），支持mRNA质粒、哺乳细胞质粒、原核表达质粒；含多宿主偏好密码子表、密码子打分与优化规则、氨基酸物性表、可选poly(A)尾序列、按蛋白特性推荐表达体系的决策表与模型适配器。仅含运行必需规则，不含任何实验记录、训练配置或派生统计。
  author: Molecular Build Agent
  last_update: '2026-11-23'
system_list:
  mrna:
    name: mRNA分子构建
    sequence_design:
      naming:
        rule: 命名编号：编号+全称 全面展示
        level: info
        check_script_hint: 检查序列注释/载体注释是否同时存在编号和全称
      backbone:
        allowed_vector:
        - pcDNA3.1
        note: 构建模板常使用mT078
        level: info
      five_cap:
        rule: 共转录加帽，注意AGG起始位点
        level: warning
        check_script_hint: 扫描5'端序列，标记AGG起始位点供人工复核
      five_utr:
        rule: 序列中不要包括起始密码子，末端必须增加Kozak序列(GCCACC)，且G含量尽可能少
        level: error
        check_script_hint:
        - 5'UTR区间不能包含AUG
        - 5'UTR末尾必须精确匹配 GCCACC
        - 计算5'UTR GC%，越低越好，仅做告警
      cds:
        codon_optimization:
          rule: 选择Jcat等算法优化，选择常用密码子
          level: info
          ai_hook: codon_optimize
        start_codon:
          preferred: AUG
          level: info
        stop_codon:
          preferred: UAA
          support_double_stop: true
          level: info
      three_utr:
        rule: 保证其miRNA结合位点数量尽量少，避免序列过长
        level: warning
        check_script_hint: 预测miRNA结合位点，统计数量，位点多则告警
      polyA:
        rule: 测序时注意观察A是否丢失
        level: warning
        check_script_hint: 标记polyA区域，测序比对时监控A长度缺失
        reference: polyA_tail_options（可选间隔型/连续型 poly(A) 序列及 A 滑脱检查要点）
      type_iis_restriction:
        rule: 插入Type IIS型限制酶位点（如BsaI）：注意观察酶切位点和识别位点应不一致
        level: error
        check_script_hint: 核查TypeIIS酶识别序列与切割位置，避免识别位点与切割位点重合
  mammalian:
    name: 哺乳系统分子构建
    sequence_design:
      naming:
        rule: 命名编号：编号+全称 全面展示
        level: info
      backbone:
        allowed_vector:
        - pcDNA3.1
        - pcDNA3.4
        - pXC17.4
        note: 构建载体可以选择已有构建酶切或V001
        level: info
      five_utr:
        rule: 序列中不要包括起始密码子，末端必须增加Kozak序列(GCCACC)，且G含量尽可能少
        level: error
        check_script_hint:
        - 5'UTR区间不能包含AUG
        - 5'UTR末尾必须精确匹配 GCCACC
      three_utr_polyA:
        rule: 添加poly(A)信号，避免AU-rich元件；保证其miRNA结合位点数量尽量少，避免序列过长
        level: warning
        check_script_hint: 检测AU-rich元件、统计miRNA结合位点数量
      template:
        rule: 可选用已有构建；合成密码子优化：基于宿主细胞进行密码子优化
        level: info
        ai_hook: codon_optimize
      cds:
        start_codon:
          preferred: AUG
          level: info
        signal_peptide:
          rule: 分泌型以及膜蛋白需要有信号肽，胞内蛋白不用包含信号肽
          level: warning
        gc_range:
          min: 40
          max: 60
          level: error
        secondary_structure:
          rule: 避免AUG下游10–15 bp形成稳定茎环结构（ΔG < -10 kcal/mol）
          level: warning
          check_script_hint: ViennaRNA计算该窗口自由能
          ai_hook: rna_fold_predict
        co_expression:
          rule: 可选P2A或IRES；P2A会导致共表达的蛋白存在残留碱基；IRES会导致下游蛋白表达量低于上游蛋白
          level: warning
        fluorescence_tag:
          allowed:
          - EGFP
          - Luciferase
          level: info
        purification_tag:
          allowed:
          - StrepII
          - 6His
          level: info
        polycistronic_tag:
          allowed:
          - T4-三聚
          - hVASP-四聚
          - GCN4-三聚
          level: info
        stop_codon:
          preferred: UAA
          support_double_stop: true
          level: info
  prokaryotic:
    name: 原核表达分子构建
    sequence_design:
      naming:
        rule: 命名编号：编号+全称 全面展示
        level: info
      backbone:
        allowed_vector:
        - pET-28a(+)
        note: 构建载体可以选择已有构建酶切
        level: info
      promoter:
        high_expression:
        - T7
        - tac
        note: 适合毒性蛋白或需要正确折叠的蛋白
        level: info
        check_script_hint: 毒性蛋白优先推荐诱导型启动子
        inducible:
        - lac
        - araBAD
        low_expression:
        - trc
      sd_rbs:
        preferred: AAGGAG
        position_note: 位于AUG上游7nt
        level: error
        check_script_hint: 校验RBS序列与起始密码子间距
      template:
        rule: 可选用已有构建；合成密码子优化：密码子适应与选择宿主菌适配优化
        level: info
        ai_hook: codon_optimize
      cds:
        start_codon:
          preferred: AUG
          level: info
        signal_peptide:
          rule: 优选原核生物信号肽
          level: info
        gc_range:
          min: 35
          max: 60
          level: error
        secondary_structure:
          rule: 避免AUG下游10–15 bp形成稳定茎环结构（ΔG < -10 kcal/mol）
          level: warning
          check_script_hint: ViennaRNA计算该窗口自由能
          ai_hook: rna_fold_predict
        fluorescence_tag:
          allowed:
          - EGFP
          - Luciferase
          level: info
        purification_tag:
          allowed:
          - StrepII
          - 6His
          level: info
        stop_codon:
          preferred: UAA
          support_double_stop: true
          level: info
common_protocol:
  primer_design:
    homology_arm_length:
      min: 15
      max: 25
      note: 同源重组引物包含15–25 bp同源臂和扩增序列
      level: error
    primer_final_conc:
      value: 10
      unit: μM
      note: 引物稀释至10 μM，注意引物与样本一一对应
      level: info
    plate_8well:
      rule: 8连排按顺序摆放，及时编号
      level: info
  pcr:
    mastermix_option:
    - name: 2× Phanta Max Master Mix
      speed: 30 s/kb
    - name: 2× Phanta UniFi Master Mix (Dye Plus)
      speed: 15 s/kb
    note: 最后加酶
    level: info
  restriction_digest:
    buffer_note: 注意10× Buffer需要完全融化
    enzyme_note: 取用时注意酶的名字、酶的使用温度
    instrument: 常用PCR仪进行反应
    level: info
  gel_extraction:
    comb: 统一使用13孔梳子（宽梳子）
    elution_volume: 30 μL纯化水
    level: info
  pcr_product_purify:
    elution_volume: 30 μL纯化水
    level: info
  ligation:
    homologous_recombination:
      mix: 诺唯赞 2×ClonExpress Mix
      min_input: ≥0.5 μL
      instrument: 必须使用PCR仪，不能使用水浴锅
      level: error
    t4_ligase:
      enzyme: NEB T4连接酶
      instrument: 必须使用PCR仪，不能使用水浴锅
      level: error
  transformation:
    competent_general:
      strain_list:
      - DH5α
      - Top10
      - Stbl3
      note: 感受态避免反复冻融
      level: warning
    prokaryotic_special_strain:
      bl21_de3: 常规表达，适合T7启动子，无蛋白酶
      rosetta: 稀有密码子适配
      bl21_codonplus: 稀有tRNA补充
      origami: 胞内氧化环境，二硫键形成
      ad494: 适合周质分泌
    note: 毒性蛋白：使用低拷贝载体+严谨型启动子或温控启动子
    level: warning
  colony_screen_verify:
    pick_colony:
      rule: 平板拍照留存，需清晰显示构建编号、感受态、日期
      level: info
    colony_pcr:
      plate_8well: 8连排按顺序摆放，及时编号
      mix_prep: 同引物样品：酶、引物、水配成Mix，数量为样品数 + 1
      system_volume: 20 μL
      level: info
  seq_submit_count:
    mrna: 4
    mammalian: 4
    prokaryotic: 4
    note: 每个构建选择4个阳性克隆用于测序
    level: info
  culture_and_preserve:
    ep_label:
      rule: EP管上需标注抗性、构建编号、感受态、日期
      level: info
    mini_prep:
      elution: 100 μL纯化水洗脱
      level: info
    maxi_prep_gravity:
      elution_range: 600–800 μL纯化水洗脱（视沉淀多少而定）
      level: info
    passage_note:
      rule: 传代过程中不加入抗生素，注意无菌操作
      level: warning
  info_archive:
    step1_primer: 引物设计好后、质粒构建前：完善在线质粒构建方案
    step2_after_build: 质粒构建后：完善在线构建信息表
    step3_seq_done: 构建及测序完成后，需存档原始峰图、COA文件、比对序列文件
    step4_glycerol_stock: 质粒和甘油菌储存：制备好、存放好后完善甘油菌&质粒在线库存表
    level: info
  glycerol_stock_storage:
    work_stock: 工作库
    long_term_stock: 储存库，用于长期保存，尽量不动用
    synthesis_note: 所有合成质粒在下单时均要求合成公司额外提供甘油菌
    level: info
codon_usage_bias:
  homo_sapiens:
    description: 人源偏好密码子（各氨基酸使用频率最高的密码子），供密码子优化参考
    source: Homo sapiens 偏好密码子表（图片整理，2026-11-20）
    notation: 表中为 DNA 形式（T）；RNA 形式将 T 替换为 U 即可
    ai_hook: codon_optimize
    preferred_codons:
      A: GCC
      C: TGC
      D: GAC
      E: GAG
      F: TTC
      G: GGC
      H: CAC
      I: ATC
      K: AAG
      L: CTG
      M: ATG
      N: AAC
      P: CCC
      Q: CAG
      R: CGC
      S: AGC
      T: ACC
      V: GTG
      W: TGG
      Y: TAC
    patterns:
    - 摆动位（第三位）规律：20 个偏好密码子全部以 C 或 G 收尾（C 结尾 13 个、G 结尾 7 个），无 A/T 结尾，与人源基因组 GC3 偏好一致。
    - 二重简并家族按简并位分组：C/T 组（D=GAC、N=AAC、F=TTC、Y=TAC、C=TGC、H=CAC）偏好 C；A/G 组（E=GAG、K=AAG、Q=CAG）偏好 G。
    - 三重简并异亮氨酸 I=ATC（家族 ATT/ATC/ATA）偏好 C。
    - 四重简并家族多偏好 C（A=GCC、G=GGC、P=CCC、T=ACC），仅 V=GTG 偏好 G。
    - 六重简并家族：L=CTG、R=CGC、S=AGC。
    - 唯一密码子：M=ATG、W=TGG 无简并，密码子固定。
    - 应用：密码子优化时优先替换为上表偏好密码子，可提升人源表达效率与 mRNA 稳定性；但仍需结合 CAI、mRNA 二级结构（ai_hook=rna_fold_predict）与宿主 tRNA 丰度综合评估。
    stats:
      total_amino_acids: 20
      c_ending: 13
      g_ending: 7
      a_ending: 0
      t_ending: 0
      source_cds: 93487
      source_codons: 40662582
      codon_db: Kazusa [gbpri]
  escherichia_coli:
    description: 大肠杆菌（E. coli, K-12）偏好密码子，供原核表达（pET-28a(+)/BL21(DE3)）密码子优化参考
    source: E. coli Codon Usage Table, Standard genetic code（图片整理，2026-11-20；Fraction 为同义密码子内占比）
    organism_class: 原核（γ-变形菌）
    genetic_code: Standard (1)
    notation: 表中为 DNA 形式（T）；RNA 形式将 T 替换为 U 即可
    ai_hook: codon_optimize
    preferred_codons:
      A: GCG
      C: TGC
      D: GAT
      E: GAA
      F: TTT
      G: GGC
      H: CAT
      I: ATT
      K: AAA
      L: CTG
      M: ATG
      N: AAC
      P: CCG
      Q: CAG
      R: CGT
      S: AGC
      T: ACC
      V: GTG
      W: TGG
      Y: TAT
    stop_codon:
      preferred: TAA
      usage:
        TAA: 0.61
        TGA: 0.3
        TAG: 0.09
      note: 原核表达建议首选 TAA，避免 UGA/UAG；双终止可使用 TAATAA
    patterns:
    - 摆动位分布：G 7 个、T 6 个、C 5 个、A 2 个；与原核/大肠杆菌 AT 丰富的基因组一致，与哺乳动物 GC3 偏好相反。
    - 二重简并家族偏好嘌呤/嘧啶因氨基酸而异：F=TTT、Y=TAT、H=CAT、D=GAT（T 结尾），K=AAA、E=GAA（A 结尾）；与人源（F=TTC、Y=TAC、H=CAC、D=GAC、K=AAG、E=GAG）几乎全部相反。
    - 四重简并家族偏好 G 结尾（A=GCG、P=CCG、V=GTG），仅 G=GGC；与昆虫偏 T、哺乳动物偏 C 不同。
    - 精氨酸 R=CGT（CGT/CGC fraction 均 0.36，但 CGT 频次 20.0/千高于 CGC 19.7/千）；人源为 CGC、CHO 为 AGG、粉纹夜蛾为 AGA。
    - 终止密码子偏好 TAA（0.61）>> TGA（0.30）> TAG（0.09），原核构建宜用 TAA/TAA 双终止。
    - 应用：原核表达（pET/BL21）密码子优化应使用本表，不可沿用哺乳动物偏好表；同时注意 SD/RBS 与 mRNA 二级结构（ai_hook=rna_fold_predict）。
    stats:
      total_amino_acids: 20
      c_ending: 5
      g_ending: 7
      a_ending: 2
      t_ending: 6
      source_table: E. coli Codon Usage Table (per 1000 codons)
  spodoptera_frugiperda:
    description: 草地贪夜蛾（Sf9/Sf21 昆虫细胞）偏好密码子，供杆状病毒表达系统密码子优化参考
    source: Spodoptera frugiperda 偏好密码子表（图片整理，2026-11-20）
    organism_class: 昆虫（鳞翅目）
    notation: 表中为 DNA 形式（T）；RNA 形式将 T 替换为 U 即可
    ai_hook: codon_optimize
    preferred_codons:
      A: GCT
      C: TGC
      D: GAC
      E: GAG
      F: TTC
      G: GGT
      H: CAC
      I: ATC
      K: AAG
      L: CTG
      M: ATG
      N: AAC
      P: CCT
      Q: CAG
      R: CGC
      S: TCC
      T: ACC
      V: GTG
      W: TGG
      Y: TAC
    patterns:
    - 摆动位以 C 为主（10 个）、G 次之（7 个），另有 3 个以 T 结尾（A=GCT、G=GGT、P=CCT），T 结尾比例高于哺乳动物。
    - 与 Homo sapiens 相比，A/G/P 三个四重简并家族由 C 结尾改为 T 结尾（GCC→GCT、GGC→GGT、CCC→CCT）。
    - 唯一密码子 M=ATG、W=TGG 保守不变。
    stats:
      total_amino_acids: 20
      c_ending: 10
      g_ending: 7
      a_ending: 0
      t_ending: 3
      source_cds: 142
      source_codons: 38777
      codon_db: Kazusa [gbinv]
  trichoplusia_ni:
    description: 粉纹夜蛾（High Five 昆虫细胞）偏好密码子，供杆状病毒表达系统密码子优化参考
    source: Trichoplusia ni 偏好密码子表（图片整理，2026-11-20）
    organism_class: 昆虫（鳞翅目）
    notation: 表中为 DNA 形式（T）；RNA 形式将 T 替换为 U 即可
    ai_hook: codon_optimize
    preferred_codons:
      A: GCT
      C: TGC
      D: GAC
      E: GAA
      F: TTC
      G: GGT
      H: CAC
      I: ATC
      K: AAG
      L: CTG
      M: ATG
      N: AAC
      P: CCT
      Q: CAG
      R: AGA
      S: TCT
      T: ACC
      V: GTC
      W: TGG
      Y: TAC
    patterns:
    - 摆动位分布最分散：C 9 个、G 5 个、T 4 个、A 2 个，是四者中 AT 结尾偏好最明显的宿主。
    - 与人源差异最大的宿主：7 个氨基酸偏好密码子不同（A/E/G/P/R/S/V）。
    - 精氨酸偏好 AGA（哺乳动物/草地贪夜蛾为 CGC、中国仓鼠为 AGG），属 AGR 型；谷氨酸偏好 GAA（其余为 GAG）。
    stats:
      total_amino_acids: 20
