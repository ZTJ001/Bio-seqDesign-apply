polyA_tail_options:
  description: mRNA 质粒 3' 端可选 poly(A) 尾 DNA 序列（按编码链书写，转录后为 mRNA 3' 端 poly(A)）
  source: 用户提供 2026-11-20
  convention: 序列按 DNA 编码链（sense strand）书写，A 尾转录为 mRNA poly(A)；若按模板链书写则为 T 尾，需在载体注释中明确方向
  option_1_interrupted:
    alias: 间隔型 poly(A) / 含 NdeI 位点
    sequence: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGCATATGACTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    length_bp: 110
    a_count: 103
    gc_percent: 3.64
    structure:
      prefix_a: 30
      insert: GCATATGACT
      insert_length_bp: 10
      suffix_a: 70
    features:
    - 10 bp 插入段 GCATATGACT 内含 NdeI 酶切位点 CATATG（第 32 位起，1-based），可作酶切鉴定与测序比对的唯一锚点
    - 插入段含 ATG（第 35 位，1-based），位于 NdeI 位点内；处于 3' 端 poly(A) 区，不构成主 ORF 起始密码子
    - 长同聚 A 被拆为 30A + 70A 两段，降低长同聚物在 PCR / 测序中的滑脱与 A 缺失风险
    - 插入段短（10 bp），含 G/C/T 使局部复杂度上升，避免全程低复杂度导致的比对困难
    suitable_for: 需要酶切鉴定或 Sanger 测序精确定位的构建；对末端连续 A 长度要求不极致的场景
  option_2_continuous:
    alias: 连续型 poly(A) / 纯 A 同聚物
    sequence: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    length_bp: 80
    a_count: 80
    gc_percent: 0.0
    structure:
      continuous_a: 80
    features:
    - 全长连续 80×A，无内部非 A 碱基，poly(A) 纯度最高、尾长定义最直接
    - 低复杂度最高：PCR / 测序易发生 A 缺失，且区域内无唯一锚点，需依赖两侧特异序列设计测序引物
    suitable_for: 追求最长连续 poly(A) 且具备可靠测序 / 合成质控的场景
  patterns:
  - 两条可选序列均为编码链上的 poly(dA) 同聚区（A 占 93.6%~100%，GC 0%~3.6%），用于转录后在 mRNA 3' 端形成 poly(A) 尾。
  - 长度区间 80~110 bp；末端连续 A 段（序列1=70A、序列2=80A）是主要功能区，建议保留 ≥70 bp 连续 A。
  - 连续型 vs 间隔型的取舍：连续型 A 纯度高，但测序/PCR 缺失风险高且无验证锚点；间隔型以 10 bp 含唯一酶切位点的插入段（GCATATGACT，含 NdeI CATATG）把同聚 A 拆成 30A+70A，兼顾测序稳定性与酶切/测序定位。
  - 间隔型插入段原则是携带唯一限制性位点（本例 NdeI），既打断同聚物又提供鉴定锚点；插入段应短（≤10 bp）且不含终止/调控信号。
  - 无论哪种设计，测序比对都要重点核查 A 长度是否丢失（同聚物滑脱），对应 mrna.sequence_design.polyA 的 warning 检查点与 check_script_hint（标记 polyA 区域并监控 A 长度缺失）。
  - poly(A) 区不应作为引物结合区或酶切位点设计区（低复杂度），引物应落在两侧特异序列上；间隔型的 NdeI 位点仅作鉴定锚点，勿与载体其他 NdeI 位点冲突。
codon_optimization:
  description: 按系统对应宿主的偏好密码子对 CDS 打分；用户确认后同义替换为宿主偏好密码子，氨基酸序列不变
  source: 宿主偏好表见 codon_usage_bias；遗传密码为标准码（NCBI translation table 1）
  system_host_map:
    mrna:
      default: homo_sapiens
      alt:
      - cricetulus_griseus
      note: mRNA 质粒在哺乳细胞表达，默认人源偏好；CHO 场景可改用 cricetulus_griseus
    mammalian:
      default: homo_sapiens
      alt:
      - cricetulus_griseus
      note: HEK293/HeLa 等用人源；CHO 稳定株改用 cricetulus_griseus
    prokaryotic:
      default: escherichia_coli
      alt: []
      note: pET/BL21(DE3) 用大肠杆菌；终止密码子首选 TAA（0.61），可用 TAA/TAA 双终止
    extended_hosts:
      spodoptera_frugiperda: Sf9/Sf21 杆状病毒系统（当前引擎系统列表未含昆虫，供扩展）
      trichoplusia_ni: High Five 杆状病毒系统（同上）
  host_alias:
    HEK293: homo_sapiens
    HeLa: homo_sapiens
    HEK293T: homo_sapiens
    CHO: cricetulus_griseus
    CHO-K1: cricetulus_griseus
