    - 摆动位 C 12 个、G 8 个，无 A/T 结尾，GC3 偏好与人源接近（哺乳动物共性）。
    - 精氨酸偏好 AGG（人源为 CGC），是与人源的主要差异之一；丝氨酸偏好 TCC（人源为 AGC）。
    - 与人源仅 R、S 两个氨基酸偏好不同，可作为 CHO 表达的优先参考表。
