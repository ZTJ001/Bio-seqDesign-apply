    - TTA
    - TTG
    - CTT
    - CTC
    - CTA
    - CTG
    I:
    - ATT
    - ATC
    - ATA
    M:
    - ATG
    V:
    - GTT
    - GTC
    - GTA
    - GTG
    S:
    - TCT
    - TCC
    - TCA
    - TCG
    - AGT
    - AGC
    P:
    - CCT
    - CCC
    - CCA
    - CCG
    T:
    - ACT
    - ACC
    - ACA
    - ACG
    A:
    - GCT
    - GCC
