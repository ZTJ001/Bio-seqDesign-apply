        V:
          homo_sapiens: GTG
          spodoptera_frugiperda: GTG
          trichoplusia_ni: GTC
          cricetulus_griseus: GTG
    all_five:
      conserved_amino_acids:
      - C
      - L
      - M
      - N
      - Q
      - T
      - W
      conserved_count: 7
      variable_amino_acids:
      - A
      - D
      - E
      - F
      - G
      - H
      - I
      - K
      - P
      - R
      - S
      - V
      - Y
      variable_count: 13
      note: 加入原核 E. coli 后保守性骤降：真核四宿主保守的 D/F/H/K/Y 在大肠杆菌中普遍改为 A/T 结尾。
    patterns:
    - 真核四宿主（人/仓鼠/两种昆虫）：20 种氨基酸中 13 种偏好密码子完全一致（C/D/F/H/I/K/L/M/N/Q/T/W/Y），7 种存在差异（A/E/G/P/R/S/V）。
    - 纳入 E. coli 后五宿主仅 7 种保守（C/L/M/N/Q/T/W），13 种存在差异——原核与真核的密码子偏好差异远大于真核内部差异。
    - 物种分化主轴：哺乳动物偏好 GC 结尾（GC3）；昆虫在 A/G/P 上偏好 T 结尾；大肠杆菌偏好 A/T 结尾（G7/T6/C5/A2），且终止密码子偏好 TAA（0.61），与真核（UAA 高频）方向不同。
    - 差异热点：精氨酸 R（真核 CGC/AGA/AGG，大肠杆菌 CGT）、丝氨酸 S（真核 AGC/TCC/TCT，大肠杆菌仍为 AGC 但频率低）、赖氨酸 K（真核 AAG，大肠杆菌 AAA）、谷氨酸 E（真核 GAG，大肠杆菌 GAA）——跨原核/真核表达必须重新优化。
    - 唯一密码子 M=ATG、W=TGG 在所有宿主中完全保守。
    - 实践建议：按表达宿主选择对应偏好表——哺乳/CHO 用 homo_sapiens 或 cricetulus_griseus，杆状病毒昆虫系统用 spodoptera_frugiperda 或 trichoplusia_ni，原核 pET/BL21 用 escherichia_coli；勿混用宿主偏好表，原核构建终止首选
      TAA。
