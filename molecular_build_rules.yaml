    - GCG
    Y:
    - TAT
    - TAC
    H:
    - CAT
    - CAC
    Q:
    - CAA
    - CAG
    N:
    - AAT
    - AAC
    K:
    - AAA
    - AAG
    D:
    - GAT
    - GAC
    E:
    - GAA
    - GAG
    C:
    - TGT
    - TGC
    W:
    - TGG
    R:
    - CGT
    - CGC
    - CGA
    - CGG
    - AGA
    - AGG
    G:
    - GGT
    - GGC
    - GGA
    - GGG
  scoring:
    method: preferred_codon_usage_ratio
    formula: score = CDS 中命中宿主偏好密码子的同义密码子数 / 可比密码子总数；起始 ATG 与终止密码子不计入分母
    output_fields:
    - host
    - score
    - matched
    - comparable
    - total_codons
    - gc_percent
    - nonpreferred_detail
    levels:
      excellent: '>=0.80'
      good: 0.60-0.79
      fair: 0.40-0.59
      poor: <0.40
    note: 简化打分，反映偏好密码子使用率；严格 CAI 需各密码子相对适应度权重，本规则库仅存单一偏好密码子
  optimization:
    strategy: 同义替换：将 CDS 每个密码子替换为其氨基酸在目标宿主的偏好密码子，保持读框与氨基酸序列不变
    preserve:
    - 氨基酸序列完全不变（仅同义替换）
    - 起始密码子 ATG 保留；终止密码子保留，原核统一为 TAA（可 TAA/TAA 双终止）
    - 5'UTR / 3'UTR / polyA / 载体骨架与读框不变
    workflow:
    - 1) 按系统取默认宿主（支持 --host 覆盖）
    - 2) 对输入序列打分并展示结果
    - 3) 询问用户是否优化；用户确认后才输出优化序列
    - 4) 输出优化后 CDS / 完整序列、变更明细、优化前后得分与 GC 变化
    cautions:
    - 优化后必须复核 GC 范围、内部提前终止、Type IIS 位点(BsaI/BsmBI/BbsI)、二级结构与 miRNA 位点
    - 同义替换不改蛋白序列，但可能改变翻译速度、折叠与 mRNA 二级结构
    - 真核宿主间差异小（A/E/G/P/R/S/V），原核与真核差异大，勿跨宿主混用偏好表
    - 优化结果为辅助设计建议，需湿实验验证
model_adapters:
  description: 4 个本地 CPU 可运行的开源工具适配层，把 ai_hook 提示升级为可执行工作流；位于 Bio-seqDesign/model_adapters/
  unified_contract: --check 部署检查 + --run(默认) FASTA 进/FASTA+JSON 出
  tools:
    lineardesign:
      role: mRNA 序列设计（密码子+MFE 联合优化）
      source: https://github.com/LinearDesignSoftware/LinearDesign (Nature 2023)
      license: 学术/研究免费，禁止随仓库再分发，由 setup.sh 克隆到 third_party/
      input_output: 蛋白FASTA -> mRNA FASTA + MFE/CAI/结构
      limit_aa: 300
      note: 内存随长度平方增长，超过约300aa会 OOM；此时闭环自动降级到 CodonBERT
    viennarna:
      role: RNA 二级结构/MFE 复核，落实 ai_hook=rna_fold_predict
      source: PyPI ViennaRNA
      input_output: DNA/RNA FASTA -> dot-bracket/MFE/GC/AUG下游窗口MFE
      alert_threshold: AUG 下游 15nt ΔG < -10 kcal/mol 告警
    jcat_python:
      role: 宿主密码子适配 + 简化 CAI（落实 ai_hook=codon_optimize）
      source: 纯 Python 等价实现，基于本库 codon_usage_bias 的 Kazusa 偏好表
      note: 本机无 Java，非官方 JCat jar；同义替换不改蛋白，命中率/CAI 为相对指标
    thermompnn:
      role: 蛋白点突变稳定性 ΔΔG 评估（PNAS 2024）
      source: https://github.com/Kuhlman-Lab/ThermoMPNN (MIT)
      input_output: PDB 结构 -> 位点饱和突变 ΔΔG
      note: 需用户提供蛋白三维结构，不参与 mRNA 序列生成；本机 CPU 可做单点扫描
  closed_loop:
    name: mRNA 设计一键闭环
    script: Bio-seqDesign/model_adapters/mrna_workflow.py
    steps:
    - LinearDesign 或 CodonBERT(>300aa降级)
    - ViennaRNA 复核
    - Jcat 宿主适配
    - SOP 引擎校验
    output:
    - final_optimized.fasta
    - workflow_report.json
    stop_codon: 统一补标准 TAA；CodonBERT 输出的 GTT 等非标准结尾会被替换
  cautions:
  - MFE 数值来自不同参数集，LinearDesign 与 ViennaRNA 可有小幅差异，用于趋势复核
  - 简化 CAI = exp(平均 ln(adaptiveness))，偏好=1、其余=0.5，非官方 JCat CAI
  - LinearDesign/ThermoMPNN 由 setup.sh 单独克隆，不随仓库提交；换机部署需联网执行一次 setup.sh
expression_system_recommendation:
  description: 按蛋白特性与实验目的推荐表达体系(mRNA/哺乳/原核)、载体与宿主；规则驱动、可解释，非数据训练模型
  version: '1.0'
  feature_extraction:
    from_sequence:
      length_aa: 蛋白序列长度（去掉末端 *）
      molecular_weight_kda: length_aa × 110 Da / 1000，粗略估算
      signal_peptide: N 端前 30 aa 疏水比例 > 0.5 且含连续 ≥7 疏水段 → 可能为分泌/膜蛋白（启发式，需 SignalP 复核）
      transmembrane_helices: 全长中连续 ≥18 个疏水 aa 的片段数 → 跨膜螺旋估计（需 TMHMM 复核）
      disulfide_potential: Cys 数量 ÷ 2，二硫键潜力（胞质还原环境下二硫键难形成）
      glycosylation_motifs: N-X-S/T (X≠P) 基序计数，N-糖基化位点（仅真核）
      charged_fraction: D/E/K/R 占全长比例
    from_user:
      purpose: vaccine / therapeutic_protein / functional_assay / structural / reagent
      requires_glycosylation: 是否依赖 N-糖基化维持活性或稳定性
      secreted: 是否为分泌蛋白（优先于序列启发式）
      requires_disulfide: 是否依赖二硫键
      toxic: 是否对宿主有毒性
      stable_line: 是否需要建立稳定表达株
      target_host: 可选，指定宿主（homo_sapiens / cricetulus_griseus / escherichia_coli 等）
  decision_rules:
  - id: REC001
    priority: 1
    name: mRNA 疫苗 / 核酸药物
    when_all:
      purpose:
      - vaccine
      - nucleic_acid_therapy
    recommend:
      system: mrna
      vector: pcDNA3.1
      host: homo_sapiens
    rationale: mRNA 体系瞬时表达、无基因组整合风险，适合疫苗与核酸药物；按规则库 mrna 白名单选 pcDNA3.1，另需按 five_cap/polyA 规则加帽加尾
    confidence: high
  - id: REC002
    priority: 2
    name: 依赖人源糖基化的分泌/膜蛋白功能实验
    when_all:
      requires_glycosylation: true
      purpose:
      - functional_assay
      - therapeutic_protein
    when_any:
      secreted: true
      has_transmembrane: true
    recommend:
      system: mammalian
      vector: pcDNA3.4
      host: homo_sapiens
    rationale: 糖基化与分泌/膜定位需真核通路；HEK293T 瞬时高表达适合功能/结合验证，pcDNA3.4 在规则库哺乳白名单内
    confidence: high
  - id: REC003
    priority: 3
    name: 治疗性重组蛋白稳定生产
    when_all:
      purpose:
      - therapeutic_protein
      stable_line: true
    recommend:
      system: mammalian
      vector: pXC17.4
      host: cricetulus_griseus
    rationale: 稳定株生产用 CHO（仓鼠）宿主与 pXC17.4（规则库白名单），密码子优化改用 cricetulus_griseus 偏好表
    confidence: high
  - id: REC004
    priority: 4
    name: 大分子/多结构域且需真核折叠
    when_all:
      length_aa_min: 120
      requires_glycosylation: false
      purpose:
      - functional_assay
      - therapeutic_protein
    recommend:
      system: mammalian
      vector: pcDNA3.1
      host: homo_sapiens
    rationale: 较大真核蛋白在原核易错折叠/无 PTM，优先哺乳瞬时；>300 aa 时 LinearDesign 内存受限，优化自动降级 CodonBERT
    confidence: medium
    notes: 昆虫杆状病毒(Sf9/High Five)适合大复合物，但其载体不在本规则库白名单，需人工补充后再选
  - id: REC005
    priority: 5
    name: 毒性蛋白原核表达
    when_all:
      toxic: true
      requires_glycosylation: false
    recommend:
      system: prokaryotic
      vector: pET-28a(+)
      host: escherichia_coli
      promoter: lac
    rationale: 原核成本低、诱导型 lac/araBAD 启动子可降低毒性蛋白本底表达；按规则库原核白名单与启动子风险分级选用
    confidence: medium
  - id: REC006
    priority: 6
    name: 无 PTM 需求的小分子蛋白快速制备
    when_all:
      requires_glycosylation: false
      requires_disulfide: false
      secreted: false
      length_aa_max: 120
    recommend:
      system: prokaryotic
      vector: pET-28a(+)
      host: escherichia_coli
      promoter: T7
    rationale: 无翻译后修饰需求的小蛋白可用 E. coli 快速高量表达；T7 高表达，密码子优化必须用 escherichia_coli 偏好表（与真核差异大）
    confidence: high
  - id: REC007
    priority: 99
    name: 默认保守选择
    when_all: {}
    recommend:
      system: mammalian
      vector: pcDNA3.1
      host: homo_sapiens
    rationale: 未命中特异规则时，默认哺乳瞬时表达（兼容真核折叠与常见 PTM），由后续校验引擎逐项复核
    confidence: low
